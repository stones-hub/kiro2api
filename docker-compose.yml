services:
  kiro2api:
    build: .
    image: kiro2api-local:latest
    container_name: kiro2api
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    # 把 .env 里的全部变量传进容器（可选配置如 KIRO_LOCAL_CACHE_*、
    # KIRO_STICKY_WAIT_SECONDS、KIRO_MODELS_FILE 无需在下面逐个列出）。
    # 这些变量用 LookupEnv 读取：不写即用默认值，写空值会启动失败，
    # 所以不能改成 ${VAR:-} 形式逐个透传。
    env_file:
      - .env
    # environment 优先级高于 env_file：下面的固定值不会被 .env 覆盖。
    environment:
      - BIND_HOST=0.0.0.0
      - PORT=8080
      - KIRO_ADMIN_BIND=0.0.0.0:8081
      - KIRO_ADMIN_DATA_DIR=/app/data
      - KIRO_ADMIN_ORIGINS=${KIRO_ADMIN_ORIGINS:-http://127.0.0.1:18081}
      - KIRO_CLIENT_TOKEN=${KIRO_CLIENT_TOKEN:?KIRO_CLIENT_TOKEN is required}
      - KIRO_ADMIN_SECRET=${KIRO_ADMIN_SECRET:?KIRO_ADMIN_SECRET is required (>=32 chars)}
      - KIRO_AUTH_TOKEN=${KIRO_AUTH_TOKEN:-}
      - GIN_MODE=${GIN_MODE:-release}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_CONSOLE=${LOG_CONSOLE:-true}
      - LOG_FILE=${LOG_FILE:-}
    volumes:
      - ./data:/app/data
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=\"Authorization: Bearer $$KIRO_CLIENT_TOKEN\" http://127.0.0.1:8080/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
